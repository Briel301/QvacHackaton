<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="diaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#006c49"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#00422b" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#diaGrad)"/>
  <!-- Decorative subtle inner ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15"/>
  <!-- Central Icon: Stylized Eco Leaf -->
  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Eco leaf silhouette -->
    <path d="M 256 110 C 180 110 130 170 130 260 C 130 335 185 390 260 390 C 330 390 380 330 380 230 C 380 140 320 110 256 110 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Leaf vein in primary emerald -->
    <path d="M 256 150 C 256 220 256 310 210 365" stroke="#006c49" stroke-width="14"/>
    <path d="M 230 240 C 270 240 320 220 340 190" stroke="#006c49" stroke-width="12"/>
    <path d="M 245 290 C 275 290 310 280 325 260" stroke="#006c49" stroke-width="10"/>
  </g>
  <!-- DIA text badge -->
  <text x="256" y="445" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="4">DIA</text>
</svg>

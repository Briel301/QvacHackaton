<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport" />
    <title>DIA - Recordatorios de Comidas</title>
    <meta name="theme-color" content="#10b981" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DIA NutriBot" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <link rel="stylesheet" href="tailwind-generated.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="tailwind.config.js"></script>
    <script src="tailwind.cdn.js" defer></script>
    <script src="components/views.js"></script>
    <script src="components/navigation.js"></script>
    <script src="components/settings.js"></script>
    <script src="components/recordatorios.js"></script>
    <script src="components/Js/main.js" type="module"></script>
  </head>
  <body class="bg-surface font-body-md text-body-md text-on-surface flex min-h-screen">
    
    <!-- MODAL DE ONBOARDING Y EDICIÓN DE PERFIL -->
    <div id="onboarding-modal" class="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-6 transition-opacity duration-300" style="display: none;">
      <div class="w-full max-w-xl rounded-3xl shadow-2xl flex flex-col max-h-full overflow-hidden relative transform transition-transform duration-300 scale-100">
        <div class="h-3 w-full bg-gradient-to-r from-emerald-400 to-emerald-600"></div>
        <div class="px-6 sm:px-8 pt-8 pb-4 text-center relative">
          <button id="btn-cerrar-onboarding" class="hidden absolute top-4 right-4 w-8 h-8 rounded-full flex items-center justify-center cursor-pointer transition-colors">
            <span class="material-symbols-outlined text-[20px]">close</span>
          </button>
          <div class="onboarding-icon-badge w-16 h-16 mx-auto rounded-full flex items-center justify-center mb-4 shadow-inner">
            <span class="material-symbols-outlined text-[32px]">waving_hand</span>
          </div>
          <h2 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Editar Perfil ✨</h2>
          <p class="text-sm sm:text-base mt-2 leading-relaxed">
            Actualiza tus datos para mantener tus cálculos nutricionales precisos.
          </p>
        </div>
        <div class="px-6 sm:px-8 pb-6 sm:pb-8 overflow-y-auto">
          <form id="onboarding-form" class="flex flex-col gap-5">
            <div class="flex flex-col gap-1.5">
              <label for="nombre" class="text-sm font-bold">¿Cómo te llamas?</label>
              <input type="text" id="nombre" required placeholder="Ej. Juan Pérez" class="w-full px-4 py-3 rounded-xl outline-none transition-all font-medium" />
            </div>
            <div class="grid grid-cols-3 gap-4">
              <div class="flex flex-col gap-1.5">
                <label for="edad" class="text-sm font-bold">Edad</label>
                <input type="number" id="edad" required min="1" placeholder="Años" class="w-full px-4 py-3 rounded-xl outline-none transition-all font-medium text-center" />
              </div>
              <div class="flex flex-col gap-1.5">
                <label for="altura" class="text-sm font-bold">Altura</label>
                <input type="number" id="altura" required min="50" step="0.01" placeholder="Metros" class="w-full px-4 py-3 rounded-xl outline-none transition-all font-medium text-center" />
              </div>
              <div class="flex flex-col gap-1.5">
                <label for="peso" class="text-sm font-bold">Peso</label>
                <input type="number" id="peso" required min="10" step="0.1" placeholder="Libras" class="w-full px-4 py-3 rounded-xl outline-none transition-all font-medium text-center" />
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="flex flex-col gap-1.5">
                <label for="genero" class="text-sm font-bold">Género</label>
                <select id="genero" required class="w-full px-4 py-3 rounded-xl outline-none transition-all font-medium">
                  <option value="" disabled selected>Selecciona...</option>
                </select>
              </div>
              <div class="flex flex-col gap-1.5">
                <label for="tipo_diabetes" class="text-sm font-bold">Tipo de Diabetes</label>
                <select id="tipo_diabetes" required class="w-full px-4 py-3 rounded-xl outline-none transition-all font-medium">
                  <option value="" disabled selected>Selecciona...</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="onboarding-footer p-6 flex justify-end">
          <button type="submit" form="onboarding-form" class="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm shadow-[0_4px_14px_rgba(16,185,129,0.4)] active:scale-95 transition-all flex items-center justify-center gap-2 cursor-pointer">
            <span>Guardar mis datos</span>
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
          </button>
        </div>
      </div>
    </div>

    <!-- BARRA LATERAL IZQUIERDA COMPARTIDA -->
    <app-sidebar></app-sidebar>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="flex-1 flex flex-col min-w-0 min-h-screen">
      
      <!-- TOPBAR CON PERFIL SUPERIOR DERECHO -->
      <header class="h-16 px-4 sm:px-6 lg:px-8 flex items-center justify-end bg-surface border-b border-surface-container-high/30">
        <div class="flex items-center gap-3">
          <button aria-label="Notificaciones" class="relative w-11 h-11 rounded-full bg-surface-container-lowest shadow-[0_2px_8px_rgba(15,23,42,0.06)] flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-95 transition-all">
            <span class="material-symbols-outlined text-[22px]">notifications</span>
            <span class="absolute top-2.5 right-2.5 w-2.5 h-2.5 bg-primary rounded-full ring-2 ring-surface-container-lowest"></span>
          </button>
          <button id="btn-open-settings-desktop" aria-label="Ajustes y preferencias" class="btn-settings w-11 h-11 rounded-full bg-surface-container-lowest shadow-[0_2px_8px_rgba(15,23,42,0.06)] flex items-center justify-center text-on-surface hover:bg-surface-container active:scale-95 transition-all cursor-pointer" title="Configuraciones">
            <span class="material-symbols-outlined text-[22px]">settings</span>
          </button>
          
          <!-- Perfil superior derecho interactivo -->
          <div id="user-profile-header-area" class="flex items-center gap-3 cursor-pointer bg-surface-container-lowest px-3.5 py-1.5 rounded-full shadow-sm hover:bg-surface-container transition-all border border-surface-container-high/40" title="Editar Perfil">
            <div class="flex flex-col text-right">
              <span id="top-right-saludo" class="text-[11px] text-on-surface-variant font-medium">¡Buenos días!</span>
              <span id="top-right-nombre" class="font-bold text-xs text-on-surface">[Nombre del Usuario]</span>
            </div>
            <div class="w-9 h-9 rounded-full bg-primary text-on-primary flex items-center justify-center overflow-hidden shadow-xs">
              <span class="material-symbols-outlined text-[20px]">person</span>
            </div>
          </div>
        </div>
      </header>

      <!-- CONTENIDO DE LA PÁGINA -->
      <main class="flex-1 px-4 sm:px-6 lg:px-8 py-5 lg:py-7 max-w-7xl w-full mx-auto pb-28 lg:pb-12">
        <!-- Renderizado dinámico vía views.js -->
      </main>
    </div>

    <!-- MODAL DE CONFIGURACIONES DE LA APLICACIÓN -->
    <div id="dia-settings-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 sm:p-6 overflow-y-auto" role="dialog" aria-modal="true" aria-labelledby="dia-settings-title">
      <div id="dia-settings-backdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity duration-300"></div>
      <div class="relative w-full max-w-xl bg-surface-container-lowest rounded-3xl p-5 sm:p-7 shadow-2xl border border-surface-container-high/80 z-10 flex flex-col max-h-[92vh] overflow-y-auto transition-transform duration-300 scale-95">
        <div class="flex items-center justify-between pb-4 border-b border-surface-container-high/60">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-primary to-primary-container text-on-primary flex items-center justify-center shadow-md shadow-primary-container/25">
              <span class="material-symbols-outlined text-[24px]">settings</span>
            </div>
            <div>
              <h2 id="dia-settings-title" class="font-headline-md text-lg sm:text-xl text-on-surface font-extrabold">Configuraciones de DIA</h2>
              <p id="dia-settings-subtitle" class="font-body-sm text-xs text-on-surface-variant">Personaliza tu experiencia, unidades de medida y preferencias.</p>
            </div>
          </div>
          <button id="btn-close-settings-modal" type="button" aria-label="Cerrar modal" class="w-10 h-10 rounded-full bg-surface-container hover:bg-surface-container-high text-on-surface-variant hover:text-on-surface flex items-center justify-center transition-all cursor-pointer">
            <span class="material-symbols-outlined text-[22px]">close</span>
          </button>
        </div>
        <div id="dia-settings-body" class="flex flex-col gap-6 py-5"></div>
        <div class="pt-4 border-t border-surface-container-high/60 flex items-center justify-end">
          <button id="btn-done-settings" type="button" class="px-6 py-2.5 rounded-xl bg-primary-container hover:bg-secondary text-on-primary font-bold text-sm shadow-md shadow-primary-container/25 active:scale-95 transition-all cursor-pointer">
            Listo
          </button>
        </div>
      </div>
    </div>

    <!-- BARRA DE NAVEGACIÓN INFERIOR (Solo móvil, sin pestaña de recordatorios) -->
    <app-bottom-nav></app-bottom-nav>

    <script>
      // Cargar contenido de la vista recordatorios.html inmediatamente
      document.addEventListener('DOMContentLoaded', () => {
        if (window.APP_VIEWS && window.APP_VIEWS['recordatorios.html']) {
          const view = window.APP_VIEWS['recordatorios.html'];
          const mainEl = document.querySelector('main');
          if (mainEl) {
            mainEl.className = view.mainClass;
            mainEl.innerHTML = view.html;
          }
          if (typeof view.init === 'function') {
            view.init();
          }
        }
      });
    </script>
  </body>
</html>
